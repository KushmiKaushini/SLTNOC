name: sltnoc
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fluttertoast: ^8.0.7
  scrollable_positioned_list: ^0.3.8
  http: ^0.13.3
  xml: ^6.5.0
  google_maps_flutter: ^2.2.4
  permission_handler: ^11.3.1
  location: ^5.0.3
  shared_preferences: ^2.0.8
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^5.0.2
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5
  #  geolocator: ^10.1.1
  flutter_secure_storage: ^9.0.0

  cupertino_icons: ^1.0.2
  custom_info_window: ^1.0.1
  flutter_app_badger: ^1.5.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/NOCPORTAL.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/NEW.png"

  flutter_lints: ^2.0.0

flutter:
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
  assets:
    - assets/Logo2.png
    - assets/SLTLogo.png
    - assets/location.png
    - assets/sltlogoforbg.png
    - assets/appbarbg2.png
    - assets/CardBG.png
    - assets/CardBGMetros.png
    - assets/NoData.png
    - assets/certs/slt_ca.crt
    - assets/chatbot-icon.png
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
